{% extends "requisitions/base.html" %}

{% block title %}更新投料點資料庫{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title text-center">更新投料點資料庫</h1>
                </div>
                <div class="card-body">
                    <p class="card-text">請上傳包含投料點資料的 Excel 檔案。</p>
                    <form action="{% url 'requisitions:update_process_type_db' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="excel_file" class="form-label">選擇 Excel 檔案</label>
                            <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required>
                        </div>
                        <button type="submit" class="btn btn-primary">上傳</button>
                        <a href="{% url 'requisitions:finished_goods_dispatch' %}" class="btn btn-secondary">返回成品撥料</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
