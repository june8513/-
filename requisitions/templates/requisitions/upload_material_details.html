{% extends "requisitions/base.html" %}

{% block title %}匯入物料明細{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title text-center">匯入物料明細</h1>
                </div>
                <div class="card-body">
                    <p class="card-text">請上傳包含物料明細資料的 Excel 檔案。</p>
                    <form action="{% url 'requisitions:upload_material_details_excel' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="excel_file" class="form-label">選擇 Excel 檔案</label>
                            <input type="file" name="file" class="form-control" accept=".xlsx, .xls" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_required_quantity_col" class="form-label">需求數量欄位名稱</label>
                            <input type="text" name="required_quantity_col" class="form-control" id="id_required_quantity_col" value="需求數量" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_demand_date_col" class="form-label">需求日期欄位名稱</label>
                            <input type="text" name="demand_date_col" class="form-control" id="id_demand_date_col" value="需求日期">
                        </div>
                        <button type="submit" class="btn btn-primary">上傳</button>
                        <a href="{% url 'requisitions:finished_goods_dispatch' %}" class="btn btn-secondary">返回成品撥料</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
